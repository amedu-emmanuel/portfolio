<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Emmanuel Amedu</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #07111f;
        --navy-soft: #0f1b2e;
        --azure: #67e8f9;
        --azure-deep: #2563eb;
        --white: #f7f9fc;
        --muted: #9fb0c9;
        --border: rgba(255, 255, 255, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        overflow: hidden;
        color: var(--white);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.25), transparent 32rem),
          radial-gradient(circle at 85% 90%, rgba(103, 232, 249, 0.14), transparent 28rem),
          var(--navy);
      }

      main {
        position: relative;
        width: min(100%, 760px);
        padding: clamp(2rem, 6vw, 4.5rem) clamp(1.5rem, 6vw, 5rem);
        overflow: hidden;
        text-align: center;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
        border: 1px solid var(--border);
        border-radius: 2rem;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      }

      main::before,
      main::after {
        position: absolute;
        width: 16rem;
        height: 16rem;
        content: "";
        border-radius: 50%;
        filter: blur(18px);
        opacity: 0.18;
        pointer-events: none;
      }

      main::before { top: -9rem; left: -8rem; background: var(--azure); }
      main::after { right: -9rem; bottom: -10rem; background: var(--azure-deep); }

      .content { position: relative; z-index: 1; }

      .illustration {
        width: min(100%, 310px);
        height: auto;
        margin: 0 auto 1.5rem;
        filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.25));
        animation: float 4.5s ease-in-out infinite;
      }

      .orbit { transform-origin: 150px 130px; animation: orbit 8s linear infinite; }
      .signal { animation: pulse 1.8s ease-in-out infinite; }

      .eyebrow {
        margin: 0 0 0.45rem;
        color: var(--azure);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 11vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      p:not(.eyebrow) {
        max-width: 34rem;
        margin: 1rem auto 1.75rem;
        color: var(--muted);
        font-size: clamp(1rem, 2.4vw, 1.18rem);
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.75rem 1.25rem;
        color: #04111d;
        font-weight: 800;
        text-decoration: none;
        background: linear-gradient(135deg, var(--azure), #8b5cf6);
        border-radius: 999px;
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.28);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .home-link:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(37, 99, 235, 0.38); }
      .home-link:focus-visible { outline: 3px solid var(--white); outline-offset: 4px; }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: 0.35; } }

      @media (max-width: 480px) {
        body { padding: 1rem; }
        main { border-radius: 1.5rem; }
        .illustration { width: min(100%, 250px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <svg class="illustration" viewBox="0 0 300 260" role="img" aria-labelledby="illustration-title illustration-description">
          <title id="illustration-title">A lost page illustration</title>
          <desc id="illustration-description">A blue compass searches around a glowing 404 symbol.</desc>
          <defs>
            <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
              <stop stop-color="#173365" />
              <stop offset="1" stop-color="#0b1830" />
            </linearGradient>
            <linearGradient id="needle" x1="0" x2="1" y1="0" y2="1">
              <stop stop-color="#67e8f9" />
              <stop offset="1" stop-color="#2563eb" />
            </linearGradient>
          </defs>
          <g class="orbit">
            <circle cx="150" cy="130" r="112" fill="none" stroke="#67e8f9" stroke-dasharray="4 12" stroke-opacity=".45" />
            <circle class="signal" cx="150" cy="18" r="7" fill="#67e8f9" />
          </g>
          <rect x="52" y="48" width="196" height="164" rx="28" fill="url(#panel)" stroke="#9fb0c9" stroke-opacity=".35" />
          <text x="150" y="134" fill="#f7f9fc" font-family="Arial, sans-serif" font-size="70" font-weight="800" text-anchor="middle">404</text>
          <circle cx="150" cy="181" r="38" fill="#07111f" stroke="#67e8f9" stroke-width="5" />
          <path d="m150 151 14 31-14-7-14 7 14-31Z" fill="url(#needle)" />
          <path d="m150 211-14-31 14 7 14-7-14 31Z" fill="#8b5cf6" />
          <circle cx="150" cy="181" r="5" fill="#f7f9fc" />
        </svg>
        <p class="eyebrow">Page not found</p>
        <h1>Oops!</h1>
        <p>The page you’re looking for doesn’t exist.</p>
        <a class="home-link" href="/">Return Home</a>
      </div>
    </main>
  </body>
</html>
